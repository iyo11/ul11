train:
  windows:
    datasets_path: "../datasets_local"
    batch_size: 8
    workers: 4
    cache: false
  linux:
    datasets_path: "../datasets"
    batch_size: 24
    workers: 10
    cache: true

  model_name:
    - "yolo11n_PreConv_FPN_C3k2CGHalfWT.yaml"


  dataset_yaml: "/NWPU_VHR.yaml"
  epochs: 200
  close_mosaic: 10
  seed: 42
  optimizer: "SGD"
  amp: false
  patience: 0
  pretrained: true
  module_edition: "e0"